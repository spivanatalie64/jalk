name: Feature Request
description: Suggest an enhancement for JALK
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scheduler, mm, fs, net, arch, drivers, documentation, infrastructure, testing]
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Validation
      options:
        - label: Gated behind CONFIG_JALK
        - label: Has documentation in docs/
        - label: Has tests in tests/
