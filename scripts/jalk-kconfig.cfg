# JALK Kernel Configuration Snippets
# These are optimization hints applied via scripts/config

# Performance tuning
CONFIG_HZ_1000=y
CONFIG_PREEMPT=y
CONFIG_PREEMPT_VOLUNTARY=n
CONFIG_NO_HZ_FULL=n
CONFIG_HZ=1000

# Modern x86_64
CONFIG_MK8=n
CONFIG_MK8SSE3=n
CONFIG_MK10=n
CONFIG_MBARCELONA=n
CONFIG_MBOBCAT=n
CONFIG_MJAGUAR=n
CONFIG_MBULLDOZER=n
CONFIG_MPILEDRIVER=n
CONFIG_MSTEAMROLLER=n
CONFIG_MEXCAVATOR=n
CONFIG_MZEN=n
CONFIG_MZEN2=n
CONFIG_MZEN3=n
CONFIG_MZEN4=n
CONFIG_MZEN5=n
CONFIG_GENERIC_CPU=y

# Legacy x86_64 (i386 compat)
CONFIG_IA32_EMULATION=y
CONFIG_IA32_AOUT=n
CONFIG_X86_X32=y

# Debug - disable for performance
CONFIG_DEBUG_INFO=n
CONFIG_DEBUG_KERNEL=n
CONFIG_SCHED_DEBUG=n
CONFIG_LOCKDEP=n
CONFIG_STACKTRACE=n

# File systems
CONFIG_EXT4_FS=y
CONFIG_BTRFS_FS=y
CONFIG_XFS_FS=y
CONFIG_F2FS_FS=y
CONFIG_BCACHEFS_FS=y

# Networking
CONFIG_TCP_CONG_ADVANCED=y
CONFIG_TCP_CONG_BBR=m
CONFIG_TCP_CONG_BBR2=m
CONFIG_DEFAULT_BBR=y
CONFIG_DEFAULT_TCP_CONG="bbr"
